<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIP GP viewer</title>
<!-- Styles: viewer.css · script: viewer.mjs (imports annotate.mjs, file_picker.mjs, run_to_tex.mjs) -->
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<aside id="sidebar">
  <div class="controls">
    <select id="run-select"><option value="">Optimiser runs…</option></select>
    <button id="runs-refresh" title="Reload the run list">Reload</button>
  </div>
  <form id="path-form">
    <input type="text" id="path-input" placeholder="GP path: full, or under a ticked dataset">
    <button type="submit">Open</button>
  </form>
  <div class="controls">
    <input type="text" id="search-input" placeholder="Search artist, title, track">
  </div>
  <!-- One box per dataset (filled from the server config), then the vocal/melody filter -->
  <div class="controls" id="filter-boxes">
    <div id="dataset-boxes"></div>
    <label class="vocal-box"><input type="checkbox" id="vocal-only"> vocal/melody tracks only</label>
  </div>
  <div id="result-count"></div>
  <ul id="track-list"></ul>
</aside>
<main id="main">
  <div id="toolbar">
    <button id="sidebar-toggle" title="Hide / show the file panel">☰</button>
    <span id="song-title">No file open</span>
    <label>Track <select id="track-select" disabled></select></label>
    <label>Realisation <select id="realisation-select" disabled></select></label>
    <button id="play-pause" disabled>Play</button>
    <button id="stop" disabled>Stop</button>
    <span id="status"></span>
  </div>
  <div id="run-bar">
    <label>Bars <input type="number" id="first-bar" min="1"></label>
    <label>– <input type="number" id="last-bar" min="1"></label>
    <label>Voice <input type="number" id="voice" min="0" value="0"></label>
    <label title="Retune every string by N semitones, pitches kept (e.g. −1: a song in Eb saved as E standard)">Tuning shift <input type="number" id="tuning-shift" value="0"></label>
    <label title="Empty = the file's tempo">Tempo <input type="number" id="tempo" min="1" placeholder="file"></label>
    <label title="How many realisations">k <input type="number" id="k-best" min="1"></label>
    <button id="run-button" disabled>Run optimiser</button>
    <span class="spacer"></span>
    <button id="edit-button" disabled>Edit</button>
    <button id="save-button" disabled>Save</button>
  </div>
  <div id="viewport"><div id="score"></div><div id="markers"></div></div>
</main>
<aside id="note-panel"></aside>

<dialog id="save-dialog">
  <form method="dialog" id="save-form">
    <strong>Save the annotation as a reference passage</strong>
    <div class="folder" id="save-folder"></div>
    <label for="save-file-name">File name</label>
    <input type="text" id="save-file-name" spellcheck="false">
    <label for="save-comment">Comment (optional)</label>
    <input type="text" id="save-comment">
    <div id="save-summary"></div>
    <!-- Shown when the name is taken: overwrite (same track only) or the next version number -->
    <div id="save-choice" hidden>
      <button type="button" id="save-overwrite">Overwrite</button>
      <button type="button" id="save-new-version">New version</button>
    </div>
    <div id="save-error"></div>
    <menu>
      <button type="button" id="save-cancel">Cancel</button>
      <button type="submit" id="save-confirm">Save</button>
    </menu>
  </form>
</dialog>

<script type="module" src="/viewer.mjs"></script>
</body>
</html>
