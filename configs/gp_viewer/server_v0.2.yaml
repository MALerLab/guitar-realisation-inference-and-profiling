# GP viewer server v0.2: where it listens, which datasets it searches and opens, how alphaTab reads them.
# Read by src/gp_viewer/server.py. Paths are relative to the repo root unless they start with ~ or /.
# v0.2: one dataset → a list of datasets (DadaGP, GOAT, ProgGP), each with its own folder and manifests.
version: "0.2"

server:
  # Localhost only; VS Code Remote-SSH forwards the port to the desktop browser
  host: 127.0.0.1
  port: 8765

# One entry per dataset; keys match the manifests' `dataset` column. Only files under a dataset's
# root can be opened (read only). Song-level columns are joined onto the track list on `path`.
datasets:
  dadagp:
    label: DadaGP
    root: ~/storage/grip/datasets/dadagp/DadaGP-v1.1
    tracks_manifest: manifests/dadagp_tracks.parquet
    songs_manifest: manifests/dadagp_songs.parquet
  goat:
    label: GOAT
    root: ~/storage/grip/datasets/goat/GOAT/data
    tracks_manifest: manifests/goat_tracks.parquet
    songs_manifest: manifests/goat_songs.parquet
  proggp:
    label: ProgGP
    root: ~/storage/grip/datasets/proggp/ProgGP/GP5
    tracks_manifest: manifests/proggp_tracks.parquet
    songs_manifest: manifests/proggp_songs.parquet

paths:
  # Optimiser run files (run_optimiser.py --save); a link to ~/storage/grip/optimiser_runs/
  runs_folder: data/optimiser_runs
  # The run config the Run button uses (guitar, cost knobs, search settings, runs folder)
  optimiser_run_config: configs/optimiser/optimiser_run_v0.1.yaml
  # Reference passages saved from annotate mode (src/calibration/reference_set.py); off git
  reference_set_folder: ~/storage/grip/calibration/reference_set
  # alphaTab's browser build, notation font and soundfont (installed by `uv run npm ci`)
  alphatab_dist: node_modules/@coderline/alphatab/dist

alphatab:
  # gp3–5 do not record the alphabet; alphaTab's utf-8 default turns non-Latin track names into "�"
  text_encoding: windows-1252
  # Playback soundfont, relative to alphatab_dist; ships with the npm package
  soundfont: soundfont/sonivox.sf2

track_list:
  # Rows per page of the song / track list (previous / next / jump to page browse the rest)
  page_size: 100

gp_files:
  # Extensions the file endpoint will serve
  allowed_extensions: [.gp3, .gp4, .gp5, .gpx, .gp]
