# Optimiser run v0.1: everything one run uses, in one file. Read by src/optimiser/run_optimiser.py.
# The three pointers name other config files (paths from the repo root); the rest are settings.
version: "0.1"

# Which guitar, cost knobs and GP parser this run uses
guitar_setup: configs/optimiser/guitar_setup/default.yaml
cost_config: configs/optimiser/optimiser_cost_v0.1.yaml
gp_parser_config: configs/data/gp_parser_v0.1.yaml

search:
  # How many of the cheapest realisations to return (plain k-best)
  k_best: 5
  # The search keeps k_best × this many paths, then drops paths whose tab (string, fret, stroke)
  # repeats a cheaper one (they differ only in hand position)
  k_search_multiplier: 4
  # How many notes back the picking hand remembers its last picked note across a legato chain.
  # Longer chains use the time to the note this many back (slightly overestimates the cost).
  pick_memory_notes: 3

# Enforced articulations (R1): true = the tab's mark is a fixed part of the music.
# Bends can't be switched off yet (the parser doesn't keep the bend amount).
articulations:
  bend: true
  legato: true         # hammer-on / pull-off marks
  slide: true          # the note a slide lands on
  left_hand_tap: true
