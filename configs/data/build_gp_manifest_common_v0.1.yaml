# GP manifest build, rules shared by every dataset: how files are read, which tracks count as guitar or
# bass, how tunings are labelled. Pointed to by each configs/data/build_gp_manifest_<dataset>_v*.yaml.
# Read by src/data/build_gp_manifest.py. Output holds indexes and counts only, never musical content.
version: "0.1"

runtime:
  # Node script that runs alphaTab and prints one JSON row per staff (path from repo root)
  node_script: src/data/alphatab_track_metadata_dump.mjs
  # How stored text (track names) is decoded. gp3–5 do not record the alphabet; windows-1252 keeps every
  # byte (so Cyrillic/Hebrew names can be re-read later) and matches PyGuitarPro. alphaTab's utf-8 default
  # destroys non-UTF-8 bytes into "�".
  text_encoding: windows-1252
  # Seconds before a single file's Node run is abandoned
  timeout_seconds: 60
  # Files read in parallel
  worker_count: 12
  # Seed for --sample-size (prototype runs on a random subset)
  sample_seed: 0

guitar_or_bass_tracks:
  # Each kept track is labelled guitar_or_bass = "guitar" or "bass"; every other track is left out.
  # - guitar program: "guitar", unless the name says bass → "bass" (35 such tracks, 2026-10-01)
  # - bass program: "bass" ("Gitara basowa" = Polish for bass guitar)
  # - any other program: name says bass → "bass", name says guitar → "guitar" ("rescue": tabbers often
  #   leave the wrong sound, e.g. "Lead Guitar" on brass 61; ~260 such tracks), else left out
  # Vocal/melody tracks are kept but flagged (name_says_vocal_or_melody), to isolate later.
  # General MIDI guitar family, 24 nylon … 31 guitar harmonics
  guitar_midi_programs: [24, 25, 26, 27, 28, 29, 30, 31]
  # General MIDI bass family, 32 acoustic bass … 39 synth bass 2
  bass_midi_programs: [32, 33, 34, 35, 36, 37, 38, 39]
  # Names are decoded as windows-1252; these re-readings of the same bytes catch Cyrillic and Hebrew names
  name_alternative_encodings: [cp1251, cp1255]
  # Matched against the lowercased name (and its re-readings); approximate by design
  guitar_name_pattern: '(guit|gtr|gitar|gitaar|chitar|kitar|гитар|גיטר|\bgt\b|\bgt\.|\bgt\s?\d|\bgit\b|\bgit\.|\bgui\b)'
  bass_name_pattern: '(\bbass|\bbajo|\bbasse|\bbaixo|\bbasso|\bbas\b|basowa|basgitaar|бас)'
  vocal_or_melody_name_pattern: '(vocal|voice|\bvoz\b|\bvox\b|melod|\bsing)'

tunings:
  # Standard tuning per instrument and string count, open-string MIDI pitches, highest string first
  standard_by_guitar_or_bass:
    guitar:
      6: [64, 59, 55, 50, 45, 40]      # E4 B3 G3 D3 A2 E2
      7: [64, 59, 55, 50, 45, 40, 35]  # + B1
    bass:
      4: [43, 38, 33, 28]              # G2 D2 A1 E1
      5: [43, 38, 33, 28, 23]          # + B0
      6: [48, 43, 38, 33, 28, 23]      # C3 + 5-string
  # A shared shift beyond this (e.g. a whole octave) is not a real retuning → tuning_class "other"
  max_abs_shift_semitones: 11
  # Drop tuning: the lowest string sits this far below the shared shift
  drop_semitones: 2
