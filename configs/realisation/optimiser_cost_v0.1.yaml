# Optimiser cost v0.1: starter cost weights for the two-hand search (Layer 1, note-level).
# Read by src/realisation/ (not built yet). Decisions + reasons: docs/optimiser_design_log.md.
# Every value is a knob: tune values first, change a formula only if knobs can't fix it.
# First guesses (2026-10-05), to be tuned by Jae against real output and docs/benchmark_songs.md.
version: "0.1"

# Picking hand: base cost of a stroke given the previous picked stroke, at a comfortable tempo.
# Unit: alternate picking on one string = 1. Strings: 1 = thinnest; "toward string 1" = the
# direction a downstroke travels. Case ids (S1, A3…) match the design log.
# Every case is later multiplied by a factor for the time since the last picked note (timing topic).
picking:
  same_string:
    alternate: 1.0       # S1 down → up, S2 up → down
    repeated_down: 2.5   # S3 down → down
    repeated_up: 4.0     # S4 up → up
  neighbouring_strings:
    down_down_sweep: 1.0                  # A1 down on 4 → down on 3
    up_up_sweep: 1.0                      # B1 up on 3 → up on 4
    first_stroke_toward_move: 1.2         # A3 down on 4 → up on 3; B4 up on 3 → down on 4
    first_stroke_against_move: 1.3        # A4 up on 4 → down on 3; B3 down on 3 → up on 4
    against_crossing_repeated_up: 6.0     # A2 up on 4 → up on 3
    against_crossing_repeated_down: 5.8   # B2 down on 3 → down on 4 (very slightly cheaper than A2)
  string_skips:
    first_stroke_toward_move: 1.6         # down on 5 → up on 3; up on 3 → down on 5
    repeated_down: 1.8                    # down on 5 → down on 3
    repeated_up: 2.0                      # up on 3 → up on 5
    first_stroke_against_move: 2.2        # up on 5 → down on 3; down on 3 → up on 5
    against_skip_repeated_down: 6.0       # down on 3 → down on 5
    against_skip_repeated_up: 7.0         # up on 5 → up on 3
    per_extra_skipped_string: 0.4         # added per string skipped beyond the first
  # A stroke with no picked stroke before it, when hard rule phrase_start_downstroke is off
  first_stroke: 1.0

# Flat costs per note
legato: 1.1                  # hammer-on / pull-off on the same string; just above an easy pick
hammer_on_from_nowhere: 5.0  # legato onto a new string or after a rest
open_string_bend: 50.0       # bend on an open string (behind the nut); only when nothing else works

# Fretting hand: weights for cost terms whose formulas are set at the timing topic
fretting_hand:
  left_shift: null       # hand moves along the neck: mm ÷ time available
  fingers_stretch: null  # finger reach from its natural spot under the hand, in mm, every note

# How costs add up over a passage: each move's total ** exponent, then summed (1 = plain sum)
adding_up:
  big_move_exponent: 2.0

# Hard rules (R8): each one approved by Jae; true = enforced
hard_rules:
  phrase_start_downstroke: true  # a new phrase starts with a downstroke; off for up/down-ambidextrous players

# Layer 1 has no phrase finding yet; these proxies mark phrase starts
phrase_start_proxies:
  rest_min_beats: 1.0  # a rest at least this long starts a new phrase
  bar_lines: false     # every bar line starts a new phrase (risky: pickups, odd groupings)
